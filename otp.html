<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ផ្ទៀងផ្ទាត់ OTP | ស្នាមញញឹមខ្មែរ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/sign_in.css">
    <link rel="stylesheet" href="assets/css/otp.css">
  </head>
  <body>

    <div class="login-container">
      
     
      <div class="login-sidebar">
        <img src="assets/img/photo_2026-04-03_12-09-42-removebg-preview.png" alt="Logo" class="brand-logo" style="filter: brightness(0) invert(1);">
        <h1 class="display-5 fw-bold mb-3" style="color: var(--gold);">ស្នាមញញឹមខ្មែរ</h1>
        <p class="lead opacity-75">សុវត្ថិភាពគណនីរបស់អ្នកគឺជាអាទិភាពរបស់យើង។ សូមផ្ទៀងផ្ទាត់អត្តសញ្ញាណរបស់អ្នក។</p>
      </div>

    
      <div class="login-form-section">
        <div class="form-wrapper text-center">
          
          <div class="mb-4">
            <i class="fa-solid fa-shield-halved fa-3x mb-3" style="color: var(--primary-blue);"></i>
            <h3 class="fw-bold mb-2">បញ្ជាក់លេខកូដ OTP</h3>
            <p class="text-muted">
              លេខកូដ ៦ ខ្ទង់ត្រូវបានផ្ញើទៅកាន់ <br>
              <span class="fw-bold text-dark">+855 96 **** 123</span>
            </p>
          </div>

          <form action="reset_password.html">
           
            <div class="otp-input-container">
              <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric">
              <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric">
              <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric">
              <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric">
              <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric">
              <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric">
            </div>

           <a href="new_password.html" class="btn btn-primary btn-login mb-4">
    ផ្ទៀងផ្ទាត់
</a>

            <div class="mb-4">
              <p class="small text-muted mb-1">មិនបានទទួលលេខកូដមែនទេ?</p>
              <div class="timer-text">ផ្ញើម្តងទៀតក្នុងរយៈពេល <span id="timer">00:59</span></div>
              <a href="#" id="resendBtn" class="fw-bold text-decoration-none d-none" style="color: var(--accent-blue);">ផ្ញើលេខកូដម្តងទៀត</a>
            </div>
          </form>

          <div class="mt-5">
             <a href="forgot_password.html" class="text-muted text-decoration-none small">
               <i class="fa-solid fa-arrow-left me-1"></i> ត្រឡប់ទៅក្រោយ
             </a>
          </div>
        </div>
      </div>
    </div>

    
  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
