<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login UI</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #6a8dff, #7f53ff);
      height: 100vh;
    }

    .login-card {
      border-radius: 20px;
      overflow: hidden;
    }

    .left-side {
      background: linear-gradient(135deg, #6a8dff, #7f53ff);
      color: white;
      padding: 40px;
    }

    .left-side h3 {
      font-weight: bold;
    }

    .right-side {
      padding: 40px;
      background: #fff;
      /* border-radius: 20px; */
    }

    .btn-login {
      background: #6a8dff;
      border: none;
      border-radius: 25px;
    }

    .btn-login:hover {
      background: #5a7df0;
    }
  </style>
</head>

<body class="d-flex justify-content-center align-items-center">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10 ">
        <div class="card login-card shadow-lg">

          <div class="row g-0">

            <!-- LEFT -->
            <div class="col-md-6 left-side d-flex flex-column justify-content-center ">
              <a class="navbar-brand" href="#">
                <img src="assets/img/photo_2026-04-03_12-09-42-removebg-preview.png" width="200" height="200"
                  class="object-fit-cover">
              </a><!-- <h3>ស្នាមញញឹមខ្មែរ</h3> -->
              <p class="mt-3">គ្រប់គ្រង និងតាមដានការបរិច្ចាគបានយ៉ាងមានប្រសិទ្ធភាព</p>
            </div>

            <!-- RIGHT -->
            <div class="col-md-6 right-side">
              <h4 class="mb-4 text-center">ចូលគណនី</h4>

              <form>
                <div class="mb-3">
                  <input type="text" class="form-control" placeholder="ឈ្មោះអ្នកប្រើប្រាស់">
                </div>

                <div class="mb-3">
                  <input type="email" class="form-control" placeholder="អ៊ីមែល">
                </div>

                <div class="mb-3">
                  <input type="password" class="form-control" placeholder="ពាក្យសម្ងាត់">
                </div>

                <div class="d-flex justify-content-between mb-3">
                  <div>
                    <input type="checkbox">ចងចាំខ្ញុំ
                  </div>
                  <a href="forgetpassword.html" style="text-decoration: none;">ភ្លេចលេខសម្ងាត់?</a>
                </div>

                <button class="btn btn-login w-100 text-white">ចូលគណនី</button>

                <p class="text-center mt-3">មិនទាន់មានគណនីមែនទេ? <a href="register.html" style="text-decoration: none;">ចុះឈ្មោះ</a></p>
              </form>
            </div>

          </div>

        </div>
      </div>
    </div>
  </div>

</body>

</html>
