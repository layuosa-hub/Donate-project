<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resetpassword</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/font/KantumruyPro/static/KantumruyPro-Bold.ttf">
    <link rel="stylesheet" href="assets/css/sign_in.css">
</head>

<body>

    <div class="card-box">
        <div class="text-start mb-3">
            <a href="login.html" class="text-decoration-none text-muted">
                <i class="bi bi-chevron-left"></i> ត្រឡប់ក្រោយ
            </a>
        </div>

        <div class="icon-box">
            <i class="bi bi-lock"></i>
        </div>

        <h5 class="fw-bold">កំណត់ពាក្យសម្ងាត់ឡើងវិញ</h5>
        <p class="text-muted small">
            សូមបញ្ចូលអ៊ីមែលរបស់អ្នក ដើម្បីទទួលលេខកូដ ៤ ខ្ទង់។
        </p>

        <form>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="បញ្ចូលពាក្យសម្ងាត់ថ្មី" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="បញ្ជាក់ពាក្យសម្ងាត់ថ្មី" required>
            </div>
            <button type="submit" class="btn btn-purple w-100">កំណត់ពាក្យសម្ងាត់</button>
        </form>

    </div>

</body>

</html>
