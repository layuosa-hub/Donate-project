<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ចុះឈ្មោះ | ស្នាមញញឹមខ្មែរ</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/sign_in.css"> 
  </head>
  <body>

    <div class="login-container">
      
   
      <div class="login-sidebar">
        <img src="assets/img/photo_2026-04-03_12-09-42-removebg-preview.png" alt="Logo" class="brand-logo" style="filter: brightness(0) invert(1);">
        <h1 class="display-5 fw-bold mb-3" style="color: var(--gold);">បង្កើតគណនី</h1>
        <p class="lead opacity-75">ក្លាយជាផ្នែកមួយនៃ "ស្នាមញញឹមខ្មែរ" ដើម្បីជួយដល់សង្គមជាតិយើង។</p>
      </div>

   
      <div class="login-form-section">
        <div class="form-wrapper">
          <div class="text-center mb-5 d-lg-none">
             <h2 class="fw-bold" style="color: var(--primary-blue);">ស្នាមញញឹមខ្មែរ</h2>
          </div>
          <h3 class="fw-bold mb-2">ចុះឈ្មោះគណនីថ្មី</h3>
          <p class="text-muted mb-4">សូមបំពេញព័ត៌មានខាងក្រោមឱ្យបានត្រឹមត្រូវ</p>

          <form action="verify.html">
           
            <div class="mb-3">
              <label class="form-label small fw-bold">ឈ្មោះពេញ</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                <input type="text" class="form-control" placeholder="ឧទាហរណ៍៖ សុខ ជា" required>
              </div>
            </div>

           
            <div class="mb-3">
              <label class="form-label small fw-bold">អ៊ីមែល ឬ លេខទូរស័ព្ទ</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                <input type="text" class="form-control" placeholder="ឧទាហរណ៍៖ example@gmail.com" required>
              </div>
            </div>

            
            <div class="mb-3">
              <label class="form-label small fw-bold">លេខសម្ងាត់</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" placeholder="បង្កើតលេខសម្ងាត់ថ្មី" required>
              </div>
            </div>

           
            <div class="mb-3">
              <label class="form-label small fw-bold">បញ្ជាក់លេខសម្ងាត់</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                <input type="password" class="form-control" placeholder="វាយលេខសម្ងាត់ម្តងទៀត" required>
              </div>
            </div>

           
            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="terms" required>
              <label class="form-check-label small" for="terms">
                ខ្ញុំយល់ព្រមតាម <a href="#" class="text-decoration-none" style="color: var(--accent-blue);">លក្ខខណ្ឌប្រើប្រាស់</a>
              </label>
            </div>

           <a href="sign_in.html" class="btn btn-login mb-4">
  ចុះឈ្មោះឥឡូវនេះ
</a>

            <p class="text-center mt-3 small">
              មានគណនីរួចហើយ? <a href="sign_in.html" class="fw-bold text-decoration-none" style="color: var(--primary-blue);">ចូលប្រើនៅទីនេះ</a>
            </p>
          </form>

          <div class="mt-4 text-center">
             <a href="index.html" class="text-muted text-decoration-none small">
               <i class="fa-solid fa-arrow-left me-1"></i> ត្រឡប់ទៅទំព័រដើម
             </a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
