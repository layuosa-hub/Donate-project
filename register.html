<!DOCTYPE html>
<html lang="km">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>បង្កើតគណនី</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <style>
    @font-face {
      font-family: 'kantumruy';
      src: url('assets/fonts/Kantumruy-Regular.ttf') format('truetype');
    }
    body {
      background: linear-gradient(135deg, #6a8dff, #7f53ff);
      min-height: 100vh;
      font-family: 'kantumruy', sans-serif;
    }

    .card {
      border-radius: 20px;
      border: none;
    }

    .left-box {
      background: linear-gradient(135deg, #315ceb, #7f53ff);
      color: #6a8dff;
      border-radius: 20px 0 0 20px;
      padding: 40px;
      height: 100%;
    }

    .left-box h3 {
      font-weight: bold;
    }

    .form-control {
      border-radius: 10px;
      padding: 10px;
    }

    .btn-primary {
      background: #6a8dff;
      border: none;
      border-radius: 25px;
    }

    .btn-primary:hover {
      background: #5a7df0;
    }

    .card-container {
      border-radius: 20px;
      overflow: hidden;
    }

    .left-box img {
      border-radius: 15px;
    }
  </style>
</head>

<body>



  <!-- Register -->
  <section class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-12">
          <div class="card shadow-lg card-container">

            <div class="row g-0">

              <!-- LEFT DESIGN -->
              <div class="col-md-6 left-side d-flex flex-column justify-content-center">
                <img
                  src="assets/img/volunteers-collecting-goods-charity-into-huge-donation-box-donating-coins-into-jar-donation-charity-donation-funds-gift-kind-concept-pinkish-coral-bluevector-isolated-illustration_335657-1387.jpg.avif"
                  alt="Register Image" class="img-fluid">
              </div>
              <!-- RIGHT -->
              <div class="col-md-6 p-4">
                <h2 class="text-center mb-4">បង្កើតគណនី</h2>

                <form class="row g-3" method="POST">

                  <div class="col-md-6">
                    <label class="form-label">នាមខ្លួន</label>
                    <input type="text" name="first_name" class="form-control" required>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">នាមត្រកូល</label>
                    <input type="text" name="last_name" class="form-control" required>
                  </div>

                  <div class="col-12">
                    <label class="form-label">អ៊ីមែល</label>
                    <input type="email" name="email" class="form-control" required>
                  </div>

                  <div class="col-12">
                    <label class="form-label">ពាក្យសម្ងាត់</label>
                    <input type="password" name="password" class="form-control" required>
                  </div>

                  <div class="col-12">
                    <label class="form-label">បញ្ជាក់ពាក្យសម្ងាត់</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                  </div>

                  <div class="col-12">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" required>
                      <label class="form-check-label">
                        ខ្ញុំយល់ព្រមលើលក្ខខណ្ឌ
                      </label>
                    </div>
                  </div>

                  <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100">
                      ចុះឈ្មោះ
                    </button>
                  </div>

                </form>
              </div>

            </div>

          </div>
        </div>

      </div>
    </div>
  </section>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
