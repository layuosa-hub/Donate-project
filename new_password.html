<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>បង្កើតលេខសម្ងាត់ថ្មី | ស្នាមញញឹមខ្មែរ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/sign_in.css">
    <link rel="stylesheet" href="assets/css/new_password.css">
  </head>
  <body>

    <div class="login-container">
      
 
      <div class="login-sidebar">
        <img src="assets/img/photo_2026-04-03_12-09-42-removebg-preview.png" alt="Logo" class="brand-logo" style="filter: brightness(0) invert(1);">
        <h1 class="display-5 fw-bold mb-3" style="color: var(--gold);">ស្នាមញញឹមខ្មែរ</h1>
        <p class="lead opacity-75">បង្កើតលេខសម្ងាត់ដែលរឹងមាំ ដើម្បីការពារគណនី និងព័ត៌មានផ្ទាល់ខ្លួនរបស់អ្នក។</p>
      </div>

      
      <div class="login-form-section">
        <div class="form-wrapper">
          
          <div class="mb-4">
            <h3 class="fw-bold mb-2">បង្កើតលេខសម្ងាត់ថ្មី</h3>
            <p class="text-muted">សូមបញ្ចូលលេខសម្ងាត់ថ្មីរបស់អ្នកខាងក្រោម។</p>
          </div>

          <form action="verification_success.html">
          
            <div class="mb-3">
              <label class="form-label small fw-bold">លេខសម្ងាត់ថ្មី</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePassword('newPassword')">
                  <i class="fa-solid fa-eye" id="icon-newPassword"></i>
                </button>
              </div>
              <div class="password-requirement">
                <div class="requirement-item"><i class="fa-solid fa-circle-info me-1"></i> យ៉ាងហោចណាស់ ៨ ខ្ទង់</div>
              </div>
            </div>

          
            <div class="mb-4">
              <label class="form-label small fw-bold">បញ្ជាក់លេខសម្ងាត់ថ្មី</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-shield-check"></i></span>
                <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePassword('confirmPassword')">
                  <i class="fa-solid fa-eye" id="icon-confirmPassword"></i>
                </button>
              </div>
            </div>

            <a href="sign_in.html" class="btn btn-primary btn-login mb-4">
    បង្កើតលេខសម្ងាត់ថ្មី
</a>

            <div class="text-center">
               <a href="login.html" class="text-muted text-decoration-none small">
                 បោះបង់ និងត្រឡប់ទៅការចូលប្រើ
               </a>
            </div>
          </form>

        </div>
      </div>
    </div>

   

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
