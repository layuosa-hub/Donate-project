<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ចូលប្រើ | ស្នាមញញឹមខ្មែរ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/sign_in.css">
  </head>
  <body>

    <div class="login-container">
    
      <div class="login-sidebar">
        <img src="assets/img/photo_2026-04-03_12-09-42-removebg-preview.png" alt="Logo" class="brand-logo" style="filter: brightness(0) invert(1);">
        <h1 class="display-5 fw-bold mb-3" style="color: var(--gold);">ស្នាមញញឹមខ្មែរ</h1>
        <p class="lead opacity-75">ចូលរួមជាមួយយើងដើម្បីផ្តល់ក្តីសង្ឃឹម និងការផ្លាស់ប្តូរវិជ្ជមានដល់សហគមន៍។</p>
      </div>

   
      <div class="login-form-section">
        <div class="form-wrapper">
          <div class="text-center mb-5 d-lg-none">
             <h2 class="fw-bold" style="color: var(--primary-blue);">ស្នាមញញឹមខ្មែរ</h2>
          </div>
          <h3 class="fw-bold mb-2">សូមចូលប្រើប្រាស់</h3>
          <p class="text-muted mb-4">សូមបញ្ចូលព័ត៌មានគណនីរបស់អ្នកខាងក្រោម</p>

          <form action="dashboard.html">
            <div class="mb-3">
              <label class="form-label small fw-bold">អ៊ីមែល ឬ លេខទូរស័ព្ទ</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                <input type="text" class="form-control" placeholder="ឧទាហរណ៍៖ info@gmail.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold d-flex justify-content-between">
                លេខសម្ងាត់
                <a href="forgetpassword.html" class="text-decoration-none small" style="color: var(--accent-blue);">ភ្លេចលេខសម្ងាត់?</a>
              </label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" placeholder="••••••••" required>
              </div>
            </div>

            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="remember">
              <label class="form-check-label small" for="remember">ចងចាំខ្ញុំ</label>
            </div>

           <a href="index2.html" class="btn btn-login mb-4">
  ចូលប្រើ
</a>

            <div class="text-center mb-4 position-relative">
              <hr>
              <span class="px-2 bg-white position-absolute top-50 start-50 translate-middle text-muted small">ឬចូលប្រើតាមរយៈ</span>
            </div>

            <div class="d-grid gap-2">
              <a href="#" class="social-login">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
                <span class="small">Google</span>
              </a>
              <a href="#" class="social-login" style="color: #1877f2;">
                <i class="fa-brands fa-facebook"></i>
                <span class="small">Facebook</span>
              </a>
            </div>

            <p class="text-center mt-5 small">
              មិនទាន់មានគណនី? <a href="register.html" class="fw-bold text-decoration-none" style="color: var(--primary-blue);">ចុះឈ្មោះឥឡូវនេះ</a>
            </p>
          </form>

          <div class="mt-4 text-center">
             <a href="index.html" class="text-muted text-decoration-none small">
               <i class="fa-solid fa-arrow-left me-1"></i> ត្រឡប់ទៅទំព័រដើម
             </a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
