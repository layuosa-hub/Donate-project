<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ភ្លេចលេខសម្ងាត់ | ស្នាមញញឹមខ្មែរ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
   
    <link rel="stylesheet" href="assets/css/sign_in.css">
    
  </head>
  <body>

    <div class="login-container">
      
   
      <div class="login-sidebar">
        <img src="assets/img/photo_2026-04-03_12-09-42-removebg-preview.png" alt="Logo" class="brand-logo" style="filter: brightness(0) invert(1);">
        <h1 class="display-5 fw-bold mb-3" style="color: var(--gold);">ស្នាមញញឹមខ្មែរ</h1>
        <p class="lead opacity-75">កុំបារម្ភ! យើងនឹងជួយអ្នកឱ្យទទួលបានលទ្ធភាពចូលប្រើប្រាស់គណនីរបស់អ្នកឡើងវិញ។</p>
      </div>

      <div class="login-form-section">
        <div class="form-wrapper">
          
          <div class="text-center mb-4">
            <div class="icon-circle">
              <i class="fa-solid fa-key fa-2x"></i>
            </div>
            <h3 class="fw-bold mb-2">ភ្លេចលេខសម្ងាត់?</h3>
            <p class="text-muted">សូមបញ្ចូលអ៊ីមែលរបស់អ្នក ដើម្បីទទួលបានតំណភ្ជាប់សម្រាប់កំណត់លេខសម្ងាត់ថ្មី។</p>
          </div>

          <form action="otp_verification.html">

            <div class="mb-4">
              <label class="form-label small fw-bold">អាសយដ្ឋានអ៊ីមែល</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                <input type="email" class="form-control" placeholder="ឧទាហរណ៍៖ name@example.com" required>
              </div>
            </div>

            <a href="otp.html" class="btn btn-primary btn-login mb-4">
    ផ្ញើតំណភ្ជាប់កំណត់ឡើងវិញ
</a>

            <div class="text-center mt-3">
              <p class="small">
                ចងចាំលេខសម្ងាត់វិញហើយ? 
                <a href="login.html" class="fw-bold text-decoration-none" style="color: var(--primary-blue);">ត្រឡប់ទៅចូលប្រើ</a>
              </p>
            </div>
          </form>

          <div class="mt-5 text-center">
             <a href="index.html" class="text-muted text-decoration-none small">
               <i class="fa-solid fa-arrow-left me-1"></i> ត្រឡប់ទៅទំព័រដើម
             </a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
